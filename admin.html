<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Админка — Sensei Sushi</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0c0e">
<link rel="icon" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--bg:#0c0c0e;--s1:#16161a;--s2:#212127;--line:#2b2b31;--text:#f6f3ee;--muted:#a39e96;--red:#e3262f;--yel:#ffd23f;--ok:#37d07a;--wa:#1fae5b;--blue:#4b8dff}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 Rubik,system-ui,-apple-system,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px;border-radius:8px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;color:var(--text);font:inherit;font-size:16px;padding:11px 12px;min-width:0}
textarea{resize:vertical;line-height:1.5;font-size:14.5px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue)}
label.fld{display:grid;gap:5px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;border-radius:12px;background:var(--s2);font-weight:600;font-size:14.5px;white-space:nowrap}
.btn.p{background:var(--red);color:#fff}
.btn.g{background:var(--ok);color:#06301a}
.btn.o{border:1px solid var(--line);background:none;color:var(--text);font-weight:500}
.btn.s{height:38px;padding:0 12px;font-size:13.5px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.row > .fld{flex:1;min-width:120px}

.bar{position:sticky;top:0;z-index:20;background:rgba(12,12,14,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:9px;height:56px;min-width:0}
.bar-in>*{flex:none}
.bar img{width:32px;height:32px;border-radius:50%}
.bar b{font-size:15px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.sv{font-size:12px;color:var(--muted);margin-right:auto;white-space:nowrap;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){.sv span,.bar .mode{display:none}}
.sv.ok{color:var(--ok)}.sv.err{color:#ff8a8d}
.mode{font-size:11.5px;padding:5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mode.cloud{color:var(--ok);border-color:rgba(55,208,122,.4)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:900px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chipsrow::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:38px;padding:0 14px;border-radius:99px;background:var(--s1);border:1px solid var(--line);color:var(--muted);font-size:14px;position:relative}
.tabs button[aria-selected=true]{background:var(--text);color:#141418;border-color:var(--text);font-weight:600}
.dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
h2.t{font-size:19px;font-weight:800;margin:18px 0 10px}
h3.c{font-size:15.5px;font-weight:700;margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.note{background:rgba(75,141,255,.09);border:1px solid rgba(75,141,255,.3);border-radius:12px;padding:11px 13px;font-size:13.5px;color:#cfe0ff;margin-bottom:12px}
.warn{background:rgba(255,210,63,.08);border:1px solid rgba(255,210,63,.3);border-radius:12px;padding:11px 13px;font-size:13.5px;color:#ffe79a;margin-bottom:12px}
.warn .row,.note .row{margin-top:9px}
.bad{background:rgba(255,90,95,.1);border:1px solid rgba(255,90,95,.35);border-radius:12px;padding:11px 13px;font-size:13.5px;color:#ffb3b5;margin-bottom:12px}
.chipsrow{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 10px;padding:0 14px;scrollbar-width:none}
.chipsrow button{flex:none;height:36px;padding:0 12px;border-radius:99px;background:var(--s1);border:1px solid var(--line);color:var(--muted);font-size:13.5px;white-space:nowrap}
.chipsrow button[aria-pressed=true]{background:var(--s2);border-color:#55555f;color:var(--text);font-weight:600}
.chipsrow button.gear{border-style:dashed}

/* заказы */
.ord{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.ord.new{border-color:rgba(227,38,47,.65);box-shadow:0 0 0 3px rgba(227,38,47,.08)}
.ord-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ord-top b{font-size:16px}
.ord-top .tm{color:var(--muted);font-size:12.5px;margin-left:auto}
.badge{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--s2);color:var(--muted)}
.badge.new{background:var(--red);color:#fff}
.badge.cook{background:var(--yel);color:#1a1a1a}
.badge.way{background:var(--blue);color:#fff}
.badge.done{background:var(--ok);color:#06301a}
.badge.cancel{background:#3a2a2b;color:#ff9a9d}
.ord ul{list-style:none;margin:9px 0;font-size:14px}
.ord li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.ord li span{color:var(--muted);white-space:nowrap}
.ord li.gft{color:var(--yel)}
.ord .meta{font-size:13.5px;color:#ddd8d0;display:grid;gap:3px;margin:8px 0}
.ord .sum{font-weight:800;font-size:16px;margin-top:6px}
.ord .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ord .acts a,.ord .acts button{height:38px;padding:0 12px;border-radius:10px;background:var(--s2);font-size:13.5px;display:inline-flex;align-items:center;gap:5px;font-weight:500;text-decoration:none;color:var(--text)}
.ord .acts .on{background:var(--text);color:#141418;font-weight:700}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
@media(min-width:620px){.stat{grid-template-columns:repeat(4,1fr)}}
.stat div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:19px;font-weight:800;white-space:nowrap}
.stat small{color:var(--muted);font-size:12px}
.top li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-size:14px;list-style:none}
.top li:first-child{border-top:0}
.top li span{color:var(--muted)}

/* меню */
.m{display:flex;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:9px;margin-bottom:8px}
.m.off{opacity:.45}
.m .pic{width:46px;height:56px;border-radius:9px;flex:none;background:var(--s2);overflow:hidden;display:grid;place-items:center;font-size:22px}
.m .pic img{width:100%;height:100%;object-fit:cover}
.m .n{flex:1;min-width:0}
.m .n b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .n small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{display:grid;gap:3px;flex:none}
.ar button{width:30px;height:26px;border-radius:7px;background:var(--s2);font-size:12px}
.ed{width:40px;height:40px;border-radius:10px;background:var(--s2);flex:none;font-size:17px}
.sw{position:relative;width:46px;height:27px;flex:none;display:inline-block}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1;padding:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:#3a3a42;transition:.18s}
.sw i::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.18s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(19px)}
.sw input:focus-visible+i{outline:2px solid var(--yel)}
.swrow{display:flex;align-items:center;gap:10px;font-size:14.5px;margin-bottom:12px;cursor:pointer}
.crow,.prow{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:8px;display:grid;gap:8px}
.crow .l1,.crow .l2,.prow .l1,.prow .l2{display:flex;gap:7px;align-items:center}
.crow .ic{width:54px;flex:none;text-align:center;padding:11px 4px}
.del{width:40px;height:40px;border-radius:10px;background:var(--s2);flex:none}
.ph-ed{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.ph-prev{width:84px;height:105px;border-radius:11px;background:var(--bg);border:1px dashed var(--line);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.ph-prev img{width:100%;height:100%;object-fit:cover}
.ph-ed .r{flex:1;min-width:0;display:grid;gap:8px}
details.more{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
details.more summary{cursor:pointer;font-size:14px;font-weight:600;margin-bottom:10px;color:var(--muted)}

/* модалка */
.dlg{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.dlg-bg{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.dlg-box{position:relative;width:100%;max-width:620px;max-height:93vh;max-height:93dvh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom));overscroll-behavior:contain}
@media(min-width:720px){.dlg{align-items:center;padding:20px}.dlg-box{border-radius:20px;max-height:88vh}}
.dlg h3{font-size:19px;font-weight:800;margin-bottom:12px;padding-right:44px}
.x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--s2);font-size:22px;z-index:2}
.save-bar{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));margin:14px -14px calc(-14px - env(safe-area-inset-bottom));padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--line);display:flex;gap:8px}
.save-bar .btn{height:48px}
.save-bar .grow{flex:1}

.gate{max-width:380px;margin:12vh auto;padding:0 16px;text-align:center}
.gate img{width:84px;height:84px;border-radius:50%;margin:0 auto 16px}
.gate h1{font-size:22px;font-weight:800;margin-bottom:6px}
.gate p{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.gate .fld{text-align:left}
.gate .btn{width:100%;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,calc(100% + 60px));opacity:0;pointer-events:none;z-index:90;background:var(--text);color:#141418;font-weight:600;font-size:14px;padding:12px 18px;border-radius:12px;transition:transform .25s,opacity .25s;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.foot-note{color:var(--muted);font-size:12.5px;margin:18px 0 8px;text-align:center}
code{background:var(--s2);padding:1px 5px;border-radius:5px;font-size:13px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px;overflow:auto;font-size:12px;line-height:1.5;max-height:260px}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <img src="img/logo.png" alt="">
  <h1>Админка</h1>
  <p id="gateHint"></p>
  <div id="gateFields"></div>
  <button class="btn p" id="gateBtn" type="button">Войти</button>
  <p class="foot-note"><a href="index.html">← вернуться на сайт</a></p>
</div>

<div id="app" hidden>
  <header class="bar">
    <div class="wrap bar-in">
      <img src="img/logo.png" alt="">
      <b>Админка</b>
      <span class="sv" id="sv"></span>
      <span class="mode" id="mode"></span>
      <a class="btn o s" href="index.html" target="_blank" rel="noopener" aria-label="Открыть сайт">Сайт ↗</a>
      <button class="btn o s" id="exit">Выйти</button>
    </div>
    <div class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="orders" aria-selected="true">Заказы<span class="dot" id="dot" hidden></span></button>
      <button role="tab" data-tab="menu" aria-selected="false">Меню</button>
      <button role="tab" data-tab="promo" aria-selected="false">Акции</button>
      <button role="tab" data-tab="settings" aria-selected="false">Настройки</button>
      <button role="tab" data-tab="cloud" aria-selected="false">Подключение</button>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>

<div class="dlg" id="dlg" hidden>
  <div class="dlg-bg" data-close></div>
  <div class="dlg-box" id="dlgBox"><button class="x" type="button" data-close aria-label="Закрыть">×</button><div id="dlgBody"></div></div>
</div>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="jsonFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script src="js/store.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var fmt=function(n){return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₸';};
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null;}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on');},2800);}
function getPath(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k];},o);}
function setPath(o,p,v){var a=p.split('.');for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v;}

var DATA=null, tab='orders', orders=[], seen=ls('sensei_seen')||[], timer=null, fileRev=0;
var mCat='sets', mQ='', oSt='all', oPer='today', oQ='';

/* ===== вход ===== */
function showGate(){
  $('#app').hidden=true; $('#gate').hidden=false;
  var cloud=Store.isCloud();
  $('#gateHint').textContent=cloud
    ? 'Вход по почте и паролю, которые заведены в базе.'
    : 'Введите код доступа. Сайт работает без базы, поэтому код — простая защита от случайных людей.';
  $('#gateFields').innerHTML=cloud
    ? '<label class="fld">Почта<input id="gEmail" type="email" autocomplete="username"></label>'+
      '<label class="fld">Пароль<input id="gPass" type="password" autocomplete="current-password"></label>'
    : '<label class="fld">Код доступа<input id="gPin" type="password" inputmode="numeric" autocomplete="current-password"></label>';
  var f=$('#gateFields').querySelector('input'); if(f)f.focus();
}
function tryLogin(){
  if(Store.isCloud()){
    var e=$('#gEmail').value.trim(), p=$('#gPass').value;
    if(!e||!p) return toast('Заполните почту и пароль');
    $('#gateBtn').disabled=true;
    Store.login(e,p).then(boot).catch(function(err){toast('Не вышло: '+err.message);})
      .then(function(){$('#gateBtn').disabled=false;});
  }else{
    var pin=ls('sensei_pin')||'1111';
    if($('#gPin').value===String(pin)){ ls('sensei_local_ok',Date.now()); boot(); }
    else toast('Неверный код');
  }
}
function loggedIn(){
  if(Store.isCloud()) return Store.authed();
  var t=ls('sensei_local_ok'); return !!(t && Date.now()-t < 12*36e5);
}

/* ===== запуск и сохранение ===== */
function boot(){
  $('#gate').hidden=true; $('#app').hidden=false;
  var m=$('#mode');
  m.textContent=Store.isCloud()?'облако':'локально';
  m.className='mode'+(Store.isCloud()?' cloud':'');
  Store.loadMenu(true,true).then(function(d){ DATA=d; }).catch(function(e){ toast('Меню не загрузилось: '+e.message); DATA=Store.normalize({}); })
    .then(function(){ render(); if(!Store.isCloud()) Store.fileRev().then(function(r){fileRev=r; if(tab==='menu')render();}).catch(function(){}); });
}
var saveT=null;
var saveState='';
function sv(state){saveState=state;var el=$('#sv');el.className='sv '+state;el.innerHTML=state==='ok'?'✓<span> сохранено</span>':state==='err'?'⚠<span> не сохранено</span>':'…<span> сохраняю</span>';}
function touch(){
  sv('busy'); clearTimeout(saveT);
  saveT=setTimeout(function(){
    Store.saveMenu(DATA).then(function(){sv('ok');}).catch(function(e){sv('err');toast('Не сохранилось: '+e.message);});
  },500);
}
if(loggedIn()) boot(); else showGate();
$('#gateBtn').onclick=tryLogin;
$('#gateFields').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
$('#exit').onclick=function(){ Store.logout(); ls('sensei_local_ok',null); location.reload(); };
$('#tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-tab]'); if(!b)return; go(b.dataset.tab);
});
function go(t){
  tab=t;
  [].forEach.call($('#tabs').children,function(x){x.setAttribute('aria-selected',x.dataset.tab===t);});
  render(); window.scrollTo(0,0);
}
function render(){
  clearInterval(timer); timer=null;
  if(tab==='orders') viewOrders();
  else if(tab==='menu') viewMenu();
  else if(tab==='promo') viewPromo();
  else if(tab==='settings') viewSettings();
  else viewCloud();
}

/* ===== поля с привязкой к данным ===== */
function F(label,path,o){
  o=o||{}; var v=getPath(DATA,path); if(o.t==='list') v=(v||[]).join(', ');
  if(o.t==='num'&&!v) v='';
  return '<label class="fld">'+label+'<input data-b="'+path+'"'+(o.t?' data-t="'+o.t+'"':'')+' type="'+(o.type||'text')+'"'+(o.im?' inputmode="'+o.im+'"':'')+
    ' value="'+esc(v==null?'':v)+'" placeholder="'+esc(o.ph||'')+'">'+(o.hint?'<span class="muted">'+o.hint+'</span>':'')+'</label>';
}
function SW(label,path){
  return '<label class="swrow"><span class="sw"><input type="checkbox" data-b="'+path+'"'+(getPath(DATA,path)?' checked':'')+'><i></i></span><span>'+label+'</span></label>';
}
function onBind(el){
  var p=el.dataset.b, t=el.dataset.t, v;
  if(el.type==='checkbox') v=el.checked;
  else if(t==='num') v=+String(el.value).replace(',','.')||0;
  else if(t==='digits') v=el.value.replace(/\D/g,'');
  else if(t==='list') v=el.value.split(',').map(function(x){return x.trim();}).filter(Boolean);
  else v=el.value;
  setPath(DATA,p,v); touch();
}

/* ===== ЗАКАЗЫ ===== */
var STATUSES=[['new','Новый'],['cook','Готовится'],['way','В пути'],['done','Доставлен'],['cancel','Отменён']];
function stName(k){var s=STATUSES.filter(function(x){return x[0]===k;})[0];return s?s[1]:k;}
var OF=[['all','Все',function(){return true;}],['new','Новые',function(o){return o.status==='new';}],
  ['work','В работе',function(o){return o.status==='cook'||o.status==='way';}],
  ['done','Доставлены',function(o){return o.status==='done';}],['cancel','Отменены',function(o){return o.status==='cancel';}]];
var OP=[['today','Сегодня'],['7','7 дней'],['30','30 дней'],['all','Всё время']];

function viewOrders(){
  $('#view').innerHTML='<h2 class="t">Заказы</h2>'+
    (Store.isCloud()?'':'<div class="warn">Сайт работает без базы, поэтому сюда попадают только заказы, сделанные <b>в этом браузере</b>. Чтобы видеть все заказы с любого устройства, подключите базу.<div class="row"><button class="btn o s" data-go="cloud">Как подключить</button></div></div>')+
    '<div class="chipsrow" id="oPer"></div><div class="stat" id="stat"></div><div class="card top" id="top" hidden></div>'+
    '<div class="row" style="margin-bottom:10px"><input id="oQ" type="search" placeholder="Поиск: имя, телефон, адрес" value="'+esc(oQ)+'" style="flex:1"><button class="btn o" id="csv">Скачать CSV</button></div>'+
    '<div class="chipsrow" id="oSt"></div><div id="olist" class="muted">Загружаю…</div>';

function compress(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,520/Math.max(im.width,im.height)), c=document.createElement('canvas');
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',.7));
    };
    im.onerror=function(){toast('Не удалось прочитать фото');};
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

          '<div class="l2"><input data-b="promo.codes.'+i+'.value" data-t="num" inputmode="numeric" value="'+(c.value||'')+'" placeholder="Скидка" aria-label="Размер скидки">'+
          '<select data-b="promo.codes.'+i+'.type" aria-label="Тип скидки" style="max-width:86px"><option value="percent"'+(c.type!=='sum'?' selected':'')+'>%</option><option value="sum"'+(c.type==='sum'?' selected':'')+'>₸</option></select>'+
          '<input data-b="promo.codes.'+i+'.min" data-t="num" inputmode="numeric" value="'+(c.min||'')+'" placeholder="от суммы, ₸" aria-label="Минимальная сумма заказа"></div></div>';
      }).join(''):'<p class="muted" style="margin-bottom:10px">Промокодов пока нет. Когда появится хотя бы один, в корзине появится поле «Промокод».</p>')+
      '<button class="btn o" id="p-add">+ Промокод</button></div>'+
    '<div class="card"><h3 class="c">📣 Объявление</h3>'+
      F('Жёлтая полоса наверху сайта','settings.announce',{ph:'Сегодня доставка бесплатно!',hint:'Пустое поле — полоса не показывается.'})+'</div>'+
    '<div class="card"><h3 class="c">💸 Зачёркнутая цена у одной позиции</h3><p class="muted">Можно поставить и вручную: «Меню» → ✎ → «Старая цена». Пока включена «Мега выгода», показывается бóльшая из двух: ручная или настоящая + сумма из «Мега выгоды».</p></div>';
}

/* ===== НАСТРОЙКИ ===== */

/* ===== ПОДКЛЮЧЕНИЕ ===== */
var SQL='-- Выполните это в Supabase → SQL Editor (можно запускать повторно)\n'+
'create table if not exists menu (\n  id int primary key default 1,\n  data jsonb not null,\n  updated_at timestamptz default now()\n);\n'+
'insert into menu (id, data) values (1, \'{}\'::jsonb) on conflict (id) do nothing;\n\n'+
'create table if not exists orders (\n  id bigint generated always as identity primary key,\n  created_at timestamptz default now(),\n  status text default \'new\',\n  name text, phone text, address text,\n  "when" text, pay text, "first" boolean,\n  comment text, items jsonb, total numeric\n);\n'+
'alter table orders add column if not exists discount numeric;\n'+
'alter table orders add column if not exists delivery numeric;\n'+
'alter table orders add column if not exists promo text;\n'+
'alter table orders add column if not exists gift text;\n\n'+
'alter table menu enable row level security;\nalter table orders enable row level security;\n\n'+
'drop policy if exists "menu read" on menu;\ndrop policy if exists "menu write" on menu;\n'+
'drop policy if exists "order create" on orders;\ndrop policy if exists "order read" on orders;\ndrop policy if exists "order update" on orders;\n\n'+
'-- меню: читают все, меняет только вошедший админ\n'+
'create policy "menu read"  on menu for select using (true);\n'+
'create policy "menu write" on menu for update to authenticated using (true) with check (true);\n\n'+
'-- заказы: создать может любой гость, видит и меняет только админ\n'+
'create policy "order create" on orders for insert with check (true);\n'+
'create policy "order read"   on orders for select to authenticated using (true);\n'+
'create policy "order update" on orders for update to authenticated using (true) with check (true);';

function viewCloud(){
  var c=Store.getCloud()||{};
  $('#view').innerHTML='<h2 class="t">Подключение базы</h2>'+
    (Store.isCloud()
      ? '<div class="note">База подключена. Заказы приходят сюда с любого устройства, а правки меню сразу видны на сайте всем.</div>'
      : '<div class="warn">База не подключена. Сайт работает, заказы уходят в WhatsApp, но в админке их не видно, а правки меню сохраняются только в этом браузере.</div>')+
    '<div class="card">'+
      '<p class="muted" style="margin-bottom:12px">Нужен бесплатный проект на <a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a>. Ключ <b>anon public</b> задуман открытым, его можно держать на сайте.</p>'+
      '<label class="fld">Адрес проекта (Project URL)<input id="c-url" value="'+esc(c.url||'')+'" placeholder="https://xxxx.supabase.co"></label>'+
      '<label class="fld">Ключ anon public<input id="c-key" value="'+esc(c.key||'')+'" placeholder="eyJhbGci..."></label>'+
      '<div class="row"><button class="btn p" id="c-save">Сохранить и проверить</button>'+
        (Store.isCloud()?'<button class="btn o" id="c-off">Отключить</button>':'')+'</div>'+
    '</div>'+
    '<h2 class="t">Шаги настройки</h2>'+
    '<div class="card"><ol style="padding-left:18px;font-size:14px;line-height:1.8">'+
      '<li>Создайте проект на supabase.com</li>'+
      '<li>Откройте <b>SQL Editor</b> и выполните код ниже</li>'+
      '<li>В <b>Authentication → Users</b> добавьте пользователя с вашей почтой и паролем — это вход в админку</li>'+
      '<li>В <b>Settings → API</b> скопируйте Project URL и ключ anon public в поля выше</li>'+
      '<li>Войдите в админку заново и поменяйте что-нибудь в меню — оно сохранится в базу</li>'+
    '</ol></div>'+
    '<div class="card"><div class="row" style="margin-bottom:10px"><button class="btn o" id="c-copy">Скопировать SQL</button></div><pre id="sql"></pre></div>'+
    '<h2 class="t">Файл меню</h2>'+
    '<div class="card"><p class="muted" style="margin-bottom:11px">Меню можно скачать файлом и положить в репозиторий как <code>data/menu.json</code>. Тогда оно станет меню по умолчанию для всех, даже без базы.</p>'+
      '<div class="row"><button class="btn o" id="dlMenu">Скачать menu.json</button>'+
      '<button class="btn o" id="c-up">Загрузить из файла</button>'+
      '<button class="btn o" id="takeNew">Сбросить к файлу сайта</button></div></div>';
  $('#sql').textContent=SQL;
}

/* ===== модалка ===== */
function dlg(html){ $('#dlgBody').innerHTML=html; $('#dlg').hidden=false; document.body.style.overflow='hidden'; $('#dlgBox').scrollTop=0; }
function closeDlg(){ var was=!$('#dlg').hidden; $('#dlg').hidden=true; document.body.style.overflow=''; if(was&&tab==='menu') viewMenu(); }

/* ===== события ===== */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-close],[data-go]'); if(!t)return;
  if(t.hasAttribute('data-close')) return closeDlg();
  if(t.dataset.go) return go(t.dataset.go);

  if(t.dataset.st){
    var id=t.dataset.oid, st=t.dataset.st;
    Store.setStatus(id,st).then(function(){
      orders.forEach(function(o){if(String(o.id)===String(id))o.status=st;});
      paintOrders();
    }).catch(function(err){toast('Не вышло: '+err.message);});
    return;
  }
  if(t.dataset.per){oPer=t.dataset.per;return paintOrders();}
  if(t.dataset.ost){oSt=t.dataset.ost;return paintOrders();}
  if(t.dataset.mcat){mCat=t.dataset.mcat;mQ='';return viewMenu();}
  if(t.dataset.mv){
    var it=DATA.items.filter(function(x){return x.id===t.dataset.mv;})[0], same=DATA.items.filter(function(x){return x.cat===it.cat;});
    var other=same[same.indexOf(it)+(+t.dataset.d)]; if(!other)return;
    var a=DATA.items.indexOf(it), b=DATA.items.indexOf(other); DATA.items[a]=other; DATA.items[b]=it;
    touch(); return paintMenu();
  }
  if(t.dataset.ed) return editItem(t.dataset.ed);
  if(t.dataset.cmv!==undefined){
    var i=+t.dataset.cmv, j=i+(+t.dataset.d); if(j<0||j>=DATA.cats.length)return;
    var x=DATA.cats[i]; DATA.cats[i]=DATA.cats[j]; DATA.cats[j]=x; touch(); return manageCats();
  }
  if(t.dataset.cdel!==undefined){
    var cc=DATA.cats[+t.dataset.cdel];
    if(DATA.items.some(function(s){return s.cat===cc.id;})) return toast('Сначала перенесите или удалите позиции');
    if(!confirm('Удалить раздел «'+cc.name+'»?'))return;
    DATA.cats.splice(+t.dataset.cdel,1); touch(); return manageCats();
  }
  if(t.dataset.pdel!==undefined){ DATA.promo.codes.splice(+t.dataset.pdel,1); touch(); return viewPromo(); }

  switch(t.id){
    case 'csv': return exportCsv();
    case 'addItem': return editItem(null);
    case 'manageCats': return manageCats();
    case 'c-add': DATA.cats.push({id:'c'+Date.now().toString(36),name:'Новый раздел',icon:'🍽',view:'list',sort:'manual',on:true}); touch(); return manageCats();
    case 'p-add': DATA.promo.codes.push({code:'',type:'percent',value:10,min:0,on:true}); touch(); return viewPromo();
    case 'savePin': ls('sensei_pin',$('#s-pin').value.trim()||'1111'); return toast('Код изменён');
    case 'dlMenu': DATA.rev=(+DATA.rev||1)+1; touch(); return download(JSON.stringify(DATA,null,1),'menu.json','application/json'); // новая версия файла: сайт у всех возьмёт её вместо старых копий
    case 'takeNew': {
      if(!confirm('Взять меню из файла сайта? Правки, сделанные в этом браузере, заменятся.'))return;
      return Store.resetMenu().then(function(d){DATA=d;fileRev=d.rev;if(Store.isCloud())touch();toast('Готово');go('menu');})
        .catch(function(err){toast('Не вышло: '+err.message);});
    }
    case 'c-save': {
      Store.setCloud({url:$('#c-url').value,key:$('#c-key').value});
      if(!Store.isCloud()) return toast('Заполните оба поля');
      return Store.test().then(function(){ toast('База отвечает. Войдите заново.'); setTimeout(function(){location.reload();},1200); })
        .catch(function(err){ Store.setCloud(null); toast('Не отвечает: '+err.message); });
    }
    case 'c-off': Store.setCloud(null); toast('Отключено'); setTimeout(function(){location.reload();},900); return;
    case 'c-copy': {
      var sel=function(){var r=document.createRange();r.selectNode($('#sql'));var s=getSelection();s.removeAllRanges();s.addRange(r);toast('Выделено — скопируйте вручную');};
      if(navigator.clipboard) navigator.clipboard.writeText(SQL).then(function(){toast('SQL скопирован');},sel); else sel();
      return;
    }
    case 'c-up': {
      var f=$('#jsonFile'); f.value='';
      f.onchange=function(){
        if(!f.files[0])return; var r=new FileReader();
        r.onload=function(){ try{ DATA=Store.normalize(JSON.parse(r.result)); touch(); toast('Меню загружено из файла'); go('menu'); }catch(err){ toast('Файл не читается'); } };
        r.readAsText(f.files[0]);
      };
      return f.click();
    }
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.b) return onBind(t);
  if(t.dataset&&t.dataset.on){
    var it=DATA.items.filter(function(x){return x.id===t.dataset.on;})[0]; if(!it)return;
    it.on=t.checked; t.closest('.m').classList.toggle('off',!t.checked); return touch();
  }
  if(t.id==='mQ'){mQ=t.value;return paintMenu();}
  if(t.id==='oQ'){oQ=t.value;return paintOrders();}
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('#dlg').hidden) closeDlg(); });
window.addEventListener('beforeunload',function(){ if(saveT&&saveState==='busy'){ try{Store.saveMenu(DATA);}catch(e){} } });
})();
</script>
